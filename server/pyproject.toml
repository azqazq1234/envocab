[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "fsrs>=6.3.2,<7",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
